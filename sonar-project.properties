# ---------------------------------------------------------------------------
# SonarQube / SonarCloud configuration for the Task Management Tool.
# The SonarScanner CLI (or SonarCloud GitHub Action) reads this file.
#
# Local usage:
#   dotnet test --collect:"XPlat Code Coverage" --results-directory TestResults
#   sonar-scanner.bat -Dsonar.login=<token>
#
# SonarCloud CI: set SONAR_TOKEN + SONAR_HOST_URL in the workflow instead.
# ---------------------------------------------------------------------------

sonar.projectKey=task-management-tool
sonar.projectName=Task Management Tool
sonar.projectVersion=1.0

# --- What to analyse -------------------------------------------------------
# Backend C# sources + frontend sources (JS/JSX)
sonar.sources=src,frontend/src
sonar.tests=tests

# .NET: the scanner reads the compiled assemblies, so run the build first.
sonar.cs.opencover.reportsPaths=TestResults/coverage.opencover.xml
sonar.cs.xunit.reportsPaths=TestResults/*.trx

# --- Optional: point at your own SonarQube server --------------------------
# Uncomment and fill in when using a self-hosted server instead of SonarCloud.
# sonar.host.url=http://localhost:9000
# sonar.login=<token>

sonar.sourceEncoding=UTF-8
